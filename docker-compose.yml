services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - learnsphere_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/learnsphere
      SESSION_SECRET: change-this-docker-session-secret-before-public-deployment
      CLIENT_URL: http://localhost:5000
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: "lax"
      TRUST_PROXY: "0"
    ports:
      - "5000:5000"

  seed:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/learnsphere
      SESSION_SECRET: local-seed-secret
      SESSION_STORE: memory
    command: ["node", "seed/seed.js"]
    profiles: ["tools"]

volumes:
  learnsphere_mongo:

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">LearnSphere MongoDB entity relationship diagram</title>
  <desc id="desc">Users create enrollments. Categories and instructors relate to courses. Courses have schedules and enrollments. Schedules are selected by enrollments. Contact messages and sessions are supporting collections.</desc>
  <defs>
    <style>
      .box{fill:#ffffff;stroke:#2457d6;stroke-width:3;rx:18}
      .head{fill:#102a56;rx:15}
      .title{font:700 22px Arial,sans-serif;fill:#ffffff}
      .field{font:16px Arial,sans-serif;fill:#101828}
      .key{font-weight:700;fill:#183a9e}
      .line{stroke:#667085;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .label{font:700 15px Arial,sans-serif;fill:#344054}
      .note{font:15px Arial,sans-serif;fill:#475467}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
  </defs>
  <rect width="1400" height="820" fill="#f6f8ff"/>
  <text x="700" y="42" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#102a56">LearnSphere MongoDB Relationship Design</text>

  <g transform="translate(60,100)">
    <rect class="box" width="300" height="220"/>
    <rect class="head" width="300" height="52"/>
    <text class="title" x="20" y="34">USER</text>
    <text class="field key" x="20" y="82">PK  _id</text>
    <text class="field" x="20" y="110">firstName, lastName</text>
    <text class="field key" x="20" y="138">UK  email</text>
    <text class="field" x="20" y="166">passwordHash, role</text>
    <text class="field" x="20" y="194">isActive, timestamps</text>
  </g>

  <g transform="translate(550,85)">
    <rect class="box" width="320" height="260"/>
    <rect class="head" width="320" height="52"/>
    <text class="title" x="20" y="34">ENROLLMENT</text>
    <text class="field key" x="20" y="82">PK  _id</text>
    <text class="field key" x="20" y="110">FK  student → User</text>
    <text class="field key" x="20" y="138">FK  course → Course</text>
    <text class="field key" x="20" y="166">FK  schedule → Schedule</text>
    <text class="field" x="20" y="194">amount, paymentStatus</text>
    <text class="field" x="20" y="222">status, progress, attendance</text>
    <text class="field key" x="20" y="250">UK  registrationReference</text>
  </g>

  <g transform="translate(1030,100)">
    <rect class="box" width="300" height="220"/>
    <rect class="head" width="300" height="52"/>
    <text class="title" x="20" y="34">SCHEDULE</text>
    <text class="field key" x="20" y="82">PK  _id</text>
    <text class="field key" x="20" y="110">FK  course → Course</text>
    <text class="field" x="20" y="138">mode, days</text>
    <text class="field" x="20" y="166">startTime, endTime</text>
    <text class="field" x="20" y="194">startDate, location</text>
  </g>

  <g transform="translate(550,470)">
    <rect class="box" width="320" height="280"/>
    <rect class="head" width="320" height="52"/>
    <text class="title" x="20" y="34">COURSE</text>
    <text class="field key" x="20" y="82">PK  _id</text>
    <text class="field key" x="20" y="110">FK  category → Category</text>
    <text class="field key" x="20" y="138">FK  instructor → Instructor</text>
    <text class="field key" x="20" y="166">UK  code, slug</text>
    <text class="field" x="20" y="194">title, descriptions, level</text>
    <text class="field" x="20" y="222">fee, durationWeeks</text>
    <text class="field" x="20" y="250">capacity, availableSeats</text>
    <text class="field" x="20" y="278">isFeatured, isActive</text>
  </g>

  <g transform="translate(60,505)">
    <rect class="box" width="300" height="190"/>
    <rect class="head" width="300" height="52"/>
    <text class="title" x="20" y="34">CATEGORY</text>
    <text class="field key" x="20" y="82">PK  _id</text>
    <text class="field key" x="20" y="110">UK  name, slug</text>
    <text class="field" x="20" y="138">description, image</text>
    <text class="field" x="20" y="166">isActive, timestamps</text>
  </g>

  <g transform="translate(1030,505)">
    <rect class="box" width="300" height="190"/>
    <rect class="head" width="300" height="52"/>
    <text class="title" x="20" y="34">INSTRUCTOR</text>
    <text class="field key" x="20" y="82">PK  _id</text>
    <text class="field key" x="20" y="110">UK  email</text>
    <text class="field" x="20" y="138">name, title, biography</text>
    <text class="field" x="20" y="166">specialisation, isActive</text>
  </g>

  <path class="line" d="M360 210 C440 210 470 210 550 210"/>
  <text class="label" x="445" y="193" text-anchor="middle">1 user → many enrollments</text>
  <path class="line" d="M710 470 C710 420 710 395 710 345"/>
  <text class="label" x="730" y="413">1 course → many enrollments</text>
  <path class="line" d="M1030 210 C950 210 930 210 870 210"/>
  <text class="label" x="950" y="193" text-anchor="middle">1 schedule → many enrollments</text>
  <path class="line" d="M1030 600 C940 600 920 600 870 600"/>
  <text class="label" x="950" y="583" text-anchor="middle">1 instructor → many courses</text>
  <path class="line" d="M360 600 C440 600 480 600 550 600"/>
  <text class="label" x="455" y="583" text-anchor="middle">1 category → many courses</text>
  <path class="line" d="M870 520 C950 450 1030 390 1130 320"/>
  <text class="label" x="1015" y="455" text-anchor="middle">1 course → many schedules</text>

  <text class="note" x="70" y="780">Supporting collections: CONTACTMESSAGE stores visitor enquiries; SESSIONS stores authenticated session and course-basket data.</text>
</svg>
